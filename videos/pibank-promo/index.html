<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pibank Promo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 400 600; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); font-weight: 400 600; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; }
      :root { --navy: #12296b; --navy-d: #0b1b4d; --yellow: #ffd600; --white: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: "DM Sans", system-ui, sans-serif; color: #fff; }
      .abs { position: absolute; }
      .shape { position: absolute; background: var(--yellow); }
      #photoWrap { left: 760px; top: 0; width: 1160px; height: 1080px; overflow: hidden; }
      #photo { position: absolute; left: -440px; top: 0; width: 1933px; height: 1080px; transform-origin: 75% 45%; }
      #photoFade { left: 760px; top: 0; width: 260px; height: 1080px; background: linear-gradient(90deg, #12296b, rgba(18,41,107,0)); }
      .disp { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; }
      .scene { left: 90px; width: 900px; }
      .kicker { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--yellow); color: var(--navy-d); font-weight: 700; font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; }
      .big { font-size: 128px; color: #fff; }
      .hl { color: var(--yellow); }
      .chip { display: inline-block; margin: 0 14px 14px 0; padding: 14px 28px; border-radius: 18px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,214,0,0.7); font-size: 38px; font-weight: 700; }
      .logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: -0.04em; }
      .logo .pi { color: var(--yellow); }
      #finalBg { left: 0; top: 0; width: 1920px; height: 1080px; background: var(--navy); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <div class="abs" id="photoWrap"><img id="photo" src="assets/img/foto.png" alt="Persona sonriendo con la app de pibank" /></div>
      <div class="abs" id="photoFade"></div>
      <div class="abs logo" id="miniLogo" style="left:90px;top:70px;font-size:64px;color:#fff"><span class="pi">pi</span>bank</div>

      <div class="abs scene" id="sc1" style="top:360px">
        <div class="kicker" id="k1">Banco Pichincha</div>
        <h1 class="disp big" id="h1" style="margin-top:26px">Pibank<br /><span class="hl">ya está<br />en Perú</span></h1>
      </div>

      <div class="abs scene" id="sc2" style="top:260px">
        <div class="disp" id="rate" style="font-size:300px;color:var(--yellow);line-height:0.9">5<span style="font-size:170px">%</span></div>
        <div class="disp" id="rateTxt" style="font-size:64px;margin-top:6px">de tasa en tu cuenta de ahorros en soles</div>
        <div id="chips" style="margin-top:44px"><span class="chip">Sin comisiones</span><span class="chip">Sin monto mínimo</span><span class="chip">Libre disponibilidad</span></div>
      </div>

      <div class="abs scene" id="sc3" style="top:330px">
        <div class="kicker" id="k3">Hazlo hoy</div>
        <h2 class="disp big" id="h3" style="margin-top:26px;font-size:120px">Ábrela <span class="hl">100% online</span></h2>
      </div>

      <div class="abs" id="finalBg"></div>
      <div class="abs" id="finalGroup" style="left:0;top:0;width:1920px;height:1080px;text-align:center">
        <div class="logo" id="bigLogo" style="position:absolute;left:0;right:0;top:300px;font-size:300px;color:#fff;line-height:1"><span class="pi">pi</span>bank</div>
        <div class="disp" id="url" style="position:absolute;left:0;right:0;top:640px;font-size:96px;color:var(--yellow)">pibank.pe</div>
        <div id="legal" style="position:absolute;left:0;right:0;bottom:56px;font-size:26px;color:rgba(255,255,255,0.8)">Tasa y condiciones según Banco Pichincha. Imagen referencial.</div>
      </div>

      <audio id="voz-p1" src="audio/seg/p1.wav" data-start="0.3" data-duration="1.43" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-p2" src="audio/seg/p2.wav" data-start="2.8" data-duration="3.68" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-p3" src="audio/seg/p3.wav" data-start="6.6" data-duration="3.2" data-track-index="12" data-volume="1"></audio>
      <audio id="musica-fondo" src="audio/musica-duck.wav" data-start="0" data-duration="10" data-track-index="13" data-volume="0.9"></audio>
      <audio id="efectos-sonido" src="audio/efectos.wav" data-start="0" data-duration="10" data-track-index="14" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const out = (sel, t) => tl.to(sel, { autoAlpha: 0, x: -60, duration: 0.35, ease: "power2.in" }, t);
      const inn = (sel, t) => tl.fromTo(sel, { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, t);
      // photo: slow push-in over the whole piece
      tl.fromTo("#photo", { scale: 1.0 }, { scale: 1.14, duration: 8.4, ease: "none" }, 0);
      tl.fromTo("#photoWrap", { autoAlpha: 0, x: 120 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#miniLogo", { autoAlpha: 0, y: -20 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 0.2);
      // scene 1
      tl.set(["#sc2", "#sc3", "#finalBg", "#finalGroup"], { autoAlpha: 0 }, 0);
      tl.fromTo("#k1", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4 }, 0.2);
      tl.fromTo("#h1", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
      out("#sc1", 2.45);
      // scene 2
      inn("#sc2", 2.6);
      tl.fromTo("#rate", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "back.out(1.8)", transformOrigin: "0% 50%" }, 2.7);
      tl.fromTo("#rateTxt", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4 }, 3.1);
      tl.fromTo(".chip", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.35, stagger: 0.3, ease: "power2.out" }, 3.9);
      out("#sc2", 6.1);
      // scene 3
      inn("#sc3", 6.3);
      tl.fromTo("#h3", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 6.45);
      tl.to("#sc3", { autoAlpha: 0, duration: 0.3 }, 8.2);
      // final: opaque navy circle reveal over photo
      tl.set("#finalBg", { autoAlpha: 1 }, 8.2);
      tl.fromTo("#finalBg", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(150% at 50% 50%)", duration: 0.7, ease: "power2.inOut" }, 8.2);
      tl.set("#finalGroup", { autoAlpha: 1 }, 8.6);
      tl.fromTo("#bigLogo", { scale: 0.7, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.6, ease: "back.out(1.7)" }, 8.7);
      tl.fromTo("#url", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 9.1);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 9.3);
      tl.to("#miniLogo", { autoAlpha: 0, duration: 0.2 }, 8.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
