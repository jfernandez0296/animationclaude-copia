<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Brand wipe — CTA-gradient diagonal sweep</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="brand-wipe" data-width="1920" data-height="1080" data-duration="0.8" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }
          #brand-wipe-clip {
            position: absolute;
            inset: 0;
          }
          /* The panel is the site's CTA button gradient, slanted; wider than the
             frame so the slanted edges never expose a corner at full cover. */
          .bw-panel {
            position: absolute;
            top: -20%;
            left: 0;
            width: 3000px;
            height: 140%;
            background: linear-gradient(
              90deg,
              var(--navy-2, #0e3a5e) 0%,
              var(--accent-2, #20748c) 55%,
              var(--accent, #42cfd2) 100%
            );
          }
          /* thin cyan leading edge that trails the panel */
          .bw-edge {
            position: absolute;
            top: -20%;
            left: 0;
            width: 26px;
            height: 140%;
            background: var(--accent, #42cfd2);
            opacity: 0.85;
          }
        </style>

        <div id="brand-wipe-clip" class="clip" data-start="0" data-duration="0.8" data-track-index="0">
          <div class="bw-edge" data-layout-allow-overflow="true"></div>
          <div class="bw-panel" data-layout-allow-overflow="true"></div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var panel = root.querySelector(".bw-panel");
            var edge = root.querySelector(".bw-edge");
            var tl = gsap.timeline({ paused: true });

            // cover: panel sweeps in from the left and fully covers the frame at 0.35s
            tl.fromTo(panel, { x: -3400, skewX: -14 }, { x: -540, skewX: -14, duration: 0.35, ease: "power3.in" }, 0);
            tl.fromTo(edge, { x: -600, skewX: -14 }, { x: 2560, skewX: -14, duration: 0.55, ease: "power3.in" }, 0.02);
            // reveal: panel keeps travelling right and uncovers the next scene
            tl.to(panel, { x: 2200, duration: 0.45, ease: "power3.out" }, 0.35);

            tl.seek(0);
            window.__timelines["brand-wipe"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
