        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) {
              return root.querySelectorAll(s);
            };
            var el = function (s) {
              return root.querySelector(s);
            };
            var BRAND = "#007b83";
            var tl = gsap.timeline({ paused: true });

            // letter helpers (deterministic: seeded PRNG, no Math.random)
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = "ch";
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) {
                    walk(n);
                  }
                });
              };
              walk(host);
              return out;
            };

            // after the sunrise reveal, the opaque backdrop fades so the layered stage returns
            tl.to(el(".sa-bg"), { autoAlpha: 0, duration: 0.5 }, 0.8);
            // slow camera push-in for the whole scene (depth, never a static frame)
            tl.fromTo(el(".sa-content"), { scale: 1 }, { scale: 1.04, duration: 6.2, ease: "none" }, 0);

            // beat 1 (0 to 1.9): "de día, todo a mano"
            var t1 = splitLetters(el(".sa-t1"));
            var r1 = rng(11);
            t1.forEach(function (c) {
              tl.fromTo(c, { autoAlpha: 0, y: -130, rotation: (r1() - 0.5) * 60 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.7)" }, 0.05 + r1() * 0.45);
              // swap: the old words fly up and away
              tl.to(c, { autoAlpha: 0, y: -120, rotation: (r1() - 0.5) * 80, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 1.75 + r1() * 0.3);
            });
            tl.fromTo(el(".sa-s1"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.55);
            tl.to(el(".sa-s1"), { autoAlpha: 0, y: -16, duration: 0.25, ease: "power2.in" }, 1.85);

            // card: stands up in 3D from the right and keeps floating
            tl.fromTo(
              el(".sa-card"),
              { autoAlpha: 0, x: 160, rotationY: 38, rotationX: 8, transformPerspective: 1500, transformOrigin: "0% 50%" },
              { autoAlpha: 1, x: 0, rotationY: -7, rotationX: 2, duration: 0.85, ease: "power4.out" },
              0.15,
            );
            tl.to(el(".sa-card"), { rotationY: -2, rotationX: -1, y: -10, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);
            tl.fromTo(q(".sa-row"), { autoAlpha: 0, x: 70 }, { autoAlpha: 1, x: 0, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 0.3);

            // chaos: alerts bounce in, the counter pulses, rows wobble nervously
            tl.fromTo(q(".sa-alert"), { scale: 0 }, { scale: 1, duration: 0.4, stagger: 0.12, ease: "back.out(3)" }, 0.9);
            tl.to(q(".sa-alert"), { scale: 1.25, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.09 }, 1.3);
            tl.to(el(".sa-pend-a"), { scale: 1.18, transformOrigin: "100% 50%", duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.0);
            tl.to(q(".sa-row"), { x: 6, duration: 0.09, yoyo: true, repeat: 5, ease: "none", stagger: 0.04 }, 1.1);

            // beat 2 (1.75 to 2.7): the headline flips to "ahora, se hacen solas"
            var t2 = splitLetters(el(".sa-t2"));
            t2.forEach(function (c, i) {
              tl.fromTo(c, { autoAlpha: 0, rotationX: -90, y: 30, transformPerspective: 700 }, { autoAlpha: 1, rotationX: 0, y: 0, duration: 0.55, ease: "back.out(1.8)" }, 2.0 + i * 0.035);
              tl.to(c, { autoAlpha: 0, y: -100, rotation: (r1() - 0.5) * 60, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 5.5 + r1() * 0.3);
            });
            tl.fromTo(el(".sa-s2"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.4);
            tl.to(el(".sa-s2"), { autoAlpha: 0, duration: 0.3 }, 5.55);

            // ScalyAI arrives: badge pops, a light sheen crosses the card, the scanner starts
            tl.fromTo(el(".sa-scaly"), { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 2.1);
            tl.fromTo(el(".sa-sheen"), { x: 0 }, { x: 1700, duration: 0.9, ease: "power2.inOut" }, 2.1);

            // chips: "Pendiente" is visible first, "Automático" is hidden
            tl.set(q(".sa-chip-auto"), { autoAlpha: 0, scale: 0.7 }, 0);
            tl.set(q(".sa-tick"), { strokeDasharray: 30, strokeDashoffset: 30 }, 0);

            // scanner: a light band moves down the list; every row it crosses flips to automatic
            tl.fromTo(el(".sa-scan"), { y: -35, autoAlpha: 0 }, { y: 480, autoAlpha: 1, duration: 2.06, ease: "none" }, 2.3);
            tl.to(el(".sa-scan"), { autoAlpha: 0, duration: 0.2 }, 4.25);

            // spark bursts at each checkbox (seeded)
            var rowsEl = el(".sa-rows");
            var rs = rng(91);
            var rows = q(".sa-row");
            var times = [2.47, 2.85, 3.24, 3.62, 4.01];
            for (var i = 0; i < rows.length; i++) {
              var row = rows[i];
              var t = times[i];
              tl.to(row.querySelector(".sa-box"), { backgroundColor: BRAND, borderColor: BRAND, duration: 0.2, ease: "power2.out" }, t);
              tl.to(row.querySelector(".sa-tick"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.05);
              tl.to(row.querySelector(".sa-chip-manual"), { autoAlpha: 0, scale: 0.8, duration: 0.2, ease: "power2.in" }, t);
              tl.to(row.querySelector(".sa-chip-auto"), { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, t + 0.05);
              tl.to(row, { scale: 1.025, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 50%" }, t);
              var alertEl = row.querySelector(".sa-alert");
              if (alertEl) tl.to(alertEl, { scale: 0, duration: 0.2, ease: "back.in(2)" }, t);
              for (var k = 0; k < 9; k++) {
                var sp = document.createElement("div");
                sp.className = "sa-spark";
                sp.style.left = "36px";
                sp.style.top = 36 + i * 96 + "px";
                sp.style.background = k % 2 ? "#47d4d4" : "#007b83";
                sp.style.opacity = "0";
                rowsEl.appendChild(sp);
                var ang = (k / 9) * Math.PI * 2 + rs() * 0.5;
                var dist = 54 + rs() * 56;
                tl.fromTo(sp, { x: 0, y: 0, autoAlpha: 1, scale: 1 }, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, autoAlpha: 0, scale: 0.2, duration: 0.55, ease: "power2.out" }, t + 0.05);
              }
            }

            // time recovered: the header flips to "todo al día", the number rolls to 12
            tl.to(el(".sa-pend-a"), { autoAlpha: 0, y: -12, duration: 0.2 }, 4.0);
            tl.fromTo(el(".sa-pend-b"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 4.1);
            tl.fromTo(el(".sa-foot"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.9);
            tl.fromTo(el(".sa-strip-a"), { yPercent: 0 }, { yPercent: -50, duration: 0.6, ease: "power3.out" }, 4.15);
            tl.fromTo(el(".sa-strip-b"), { yPercent: 0 }, { yPercent: -66.667, duration: 0.8, ease: "power3.out" }, 4.15);

            tl.seek(0);
            window.__timelines["scene-auto-tasks"] = tl;
          })();
        </script>
