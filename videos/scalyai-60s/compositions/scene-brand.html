<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acto 2: esto es ScalyAI</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-brand" data-width="1920" data-height="1080" data-duration="8" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            color: var(--fg, #041b3d);
            font-family: var(--font-body, system-ui, sans-serif);
          }
          #scene-brand-clip {
            position: absolute;
            inset: 0;
          }
          .sb-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
            padding: 80px 120px;
          }
          .sb-eyebrow {
            font-size: 35px;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--brand, #007b83);
          }
          .sb-word {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 230px;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.22;
            margin: 6px 0 4px;
            white-space: nowrap;
          }
          .sb-ch {
            display: inline-block;
          }
          .sb-ai {
            font-weight: 500;
            color: #007b83;
          }
          .sb-sp {
            display: inline-block;
            width: 0.3em;
          }
          .sb-sym {
            display: block;
            flex: 0 0 auto;
            width: 0.92em;
            height: 0.92em;
            margin-right: 0.2em;
            align-self: center;
            overflow: visible;
          }
          .sb-tag {
            display: flex;
            gap: 16px;
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--fg, #041b3d);
            white-space: nowrap;
          }
          .sb-tw {
            display: inline-block;
          }
          .sb-cards {
            display: flex;
            gap: 36px;
            margin-top: 26px;
          }
          .sb-card {
            display: flex;
            align-items: center;
            gap: 24px;
            width: 520px;
            height: 168px;
            padding: 0 32px;
            border-radius: 34px;
            background: #ffffff;
            border: 3px solid transparent;
            box-shadow: 0 30px 60px rgba(4, 27, 61, 0.14), 0 8px 18px rgba(4, 27, 61, 0.08);
          }
          .sb-ico {
            display: flex;
            flex: 0 0 84px;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            border-radius: 26px;
            background: #e6f2f1;
            color: var(--brand, #007b83);
          }
          .sb-ico svg {
            display: block;
            width: 46px;
            height: 46px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .sb-text {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
          }
          .sb-sheen {
            position: absolute;
            top: 0;
            left: -30%;
            width: 16%;
            height: 100%;
            background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.9) 50%, transparent 100%);
            mix-blend-mode: soft-light;
            pointer-events: none;
          }
        </style>

        <div id="scene-brand-clip" class="clip" data-start="0" data-duration="8" data-track-index="0">
          <div class="sb-content">
            <div class="sb-eyebrow" data-layout-allow-overlap="true">Esto es</div>
            <div class="sb-word" role="img" aria-label="Scaly AI">
              <svg class="sb-sym" viewBox="0 0 64 64" aria-hidden="true">
                <defs><linearGradient id="sb-gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007b83" /><stop offset="1" stop-color="#47d4d4" /></linearGradient></defs>
                <rect class="sb-bar" x="18" y="4" width="44" height="14" rx="7" fill="url(#sb-gl)" />
                <rect class="sb-bar" x="2" y="25" width="60" height="14" rx="7" fill="#007b83" />
                <rect class="sb-bar" x="2" y="46" width="44" height="14" rx="7" fill="#041b3d" />
              </svg>
              <span class="sb-name">Scaly</span><span class="sb-sp"></span><span class="sb-name sb-ai">AI</span>
            </div>
            <div class="sb-tag">Software e IA a la medida de tu negocio</div>
            <div class="sb-cards">
              <div class="sb-card sb-c1">
                <div class="sb-ico"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" /></svg></div>
                <div class="sb-text">Automatizamos lo repetitivo</div>
              </div>
              <div class="sb-card sb-c2">
                <div class="sb-ico"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg></div>
                <div class="sb-text">Ponemos tus datos a trabajar</div>
              </div>
              <div class="sb-card sb-c3">
                <div class="sb-ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg></div>
                <div class="sb-text">Ordenamos tu operación</div>
              </div>
            </div>
          </div>
          <div class="sb-sheen" data-layout-allow-overflow="true"></div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) {
              return root.querySelectorAll(s);
            };
            var el = function (s) {
              return root.querySelector(s);
            };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitChars = function (host) {
              var text = host.textContent;
              host.textContent = "";
              var out = [];
              Array.prototype.slice.call(text).forEach(function (ch) {
                var s = document.createElement("span");
                s.className = "sb-ch";
                s.textContent = ch;
                host.appendChild(s);
                out.push(s);
              });
              return out;
            };

            // slow camera push-in for the whole scene
            tl.fromTo(el(".sb-content"), { scale: 1 }, { scale: 1.04, duration: 8, ease: "none" }, 0);

            // eyebrow
            tl.fromTo(el(".sb-eyebrow"), { autoAlpha: 0, y: 24, scaleX: 1.25 }, { autoAlpha: 1, y: 0, scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.55);

            // wordmark: every letter flips in around its own vertical axis, from the centre outwards
            var letters = [];
            q(".sb-name").forEach(function (h) { letters = letters.concat(splitChars(h)); });
            var mid = (letters.length - 1) / 2;
            letters.forEach(function (c, i) {
              tl.fromTo(c, { autoAlpha: 0, rotationY: -100, y: 60, transformPerspective: 900 }, { autoAlpha: 1, rotationY: 0, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.75 + Math.abs(i - mid) * 0.08);
            });
            // the three bars of the symbol slide out from the left before the letters
            tl.fromTo(q(".sb-bar"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, stagger: 0.12, ease: "back.out(1.6)" }, 0.6);

            // tagline: word by word out of a blur
            var words = el(".sb-tag");
            var txt = words.textContent;
            words.textContent = "";
            txt.split(" ").forEach(function (w) {
              var s = document.createElement("span");
              s.className = "sb-tw";
              s.textContent = w;
              words.appendChild(s);
            });
            tl.fromTo(q(".sb-tw"), { autoAlpha: 0, y: 30, filter: "blur(12px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.6, stagger: 0.09, ease: "power2.out" }, 1.9);

            // light sheen crosses the wordmark
            tl.set(el(".sb-sheen"), { autoAlpha: 0 }, 0);
            tl.fromTo(el(".sb-sheen"), { x: 0, autoAlpha: 1 }, { x: 1900, autoAlpha: 1, duration: 1.1, ease: "power2.inOut" }, 2.2);
            tl.to(el(".sb-sheen"), { autoAlpha: 0, duration: 0.15 }, 3.3);

            // three value cards: rise in 3D, then float
            tl.fromTo(
              q(".sb-card"),
              { autoAlpha: 0, y: 140, rotationX: -55, transformPerspective: 1100, transformOrigin: "50% 100%" },
              { autoAlpha: 1, y: 0, rotationX: 0, duration: 0.85, stagger: 0.18, ease: "back.out(1.5)" },
              2.9,
            );
            var cards = q(".sb-card");
            for (var i = 0; i < cards.length; i++) {
              tl.to(cards[i], { y: -10, duration: 1.2 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.0 + i * 0.1);
              // spotlight each promise in turn
              tl.to(cards[i], { scale: 1.05, borderColor: "#007b83", duration: 0.35, ease: "back.out(2)", transformOrigin: "50% 50%" }, 4.4 + i * 1.0);
              tl.to(cards[i], { scale: 1, borderColor: "rgba(0, 123, 131,0)", duration: 0.35, ease: "power2.out" }, 5.15 + i * 1.0);
            }

            // dust of sparks around the wordmark when the period lands
            var layer = el(".sb-content");
            var r = rng(61);
            for (var k = 0; k < 16; k++) {
              var sp = document.createElement("div");
              var size = 8 + Math.round(r() * 10);
              sp.style.cssText = "position:absolute;left:960px;top:400px;width:" + size + "px;height:" + size + "px;border-radius:50%;opacity:0;pointer-events:none;background:" + (k % 2 ? "#47d4d4" : "#007b83") + ";";
              layer.appendChild(sp);
              var a = (k / 16) * Math.PI * 2 + r() * 0.4;
              var d = 140 + r() * 260;
              tl.fromTo(sp, { x: 0, y: 0, autoAlpha: 1, scale: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d * 0.7, autoAlpha: 0, scale: 0.2, duration: 0.9, ease: "power3.out" }, 1.4);
            }

            tl.seek(0);
            window.__timelines["scene-brand"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
