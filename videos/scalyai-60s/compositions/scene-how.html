<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acto 4: cómo trabajamos, sin proyectos eternos</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-how" data-width="1920" data-height="1080" data-duration="8.6" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            color: var(--fg, #041b3d);
            font-family: var(--font-body, system-ui, sans-serif);
          }
          #scene-how-clip {
            position: absolute;
            inset: 0;
          }
          .sh-bg {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(circle at 18% 8%, rgba(71, 212, 212, 0.3), transparent 46%),
              radial-gradient(circle at 88% 92%, rgba(0, 123, 131, 0.2), transparent 46%),
              radial-gradient(ellipse at 50% 38%, #fcfcf8 0%, #f0f1e8 52%, #e2e5da 100%);
          }
          .sh-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 56px;
            padding: 70px 150px;
          }
          .sh-title {
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 100px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            white-space: nowrap;
          }
          .sh-accent {
            color: var(--brand, #007b83);
          }
          .sh-track {
            position: relative;
            width: 1500px;
            height: 420px;
          }
          .sh-line {
            position: absolute;
            left: 150px;
            right: 150px;
            top: 62px;
            height: 8px;
            border-radius: 4px;
            background: #cdd4cb;
          }
          .sh-line-fill {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: linear-gradient(90deg, #041b3d, #007b83, #47d4d4);
          }
          .sh-dot {
            position: absolute;
            top: 50px;
            left: 150px;
            width: 32px;
            height: 32px;
            margin-left: -16px;
            border-radius: 50%;
            background: #47d4d4;
            box-shadow: 0 0 0 10px rgba(71, 212, 212, 0.3);
          }
          .sh-step {
            position: absolute;
            top: 0;
            width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
          }
          .sh-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: #ffffff;
            border: 6px solid #cdd4cb;
            color: var(--muted, #2f4560);
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 76px;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 20px 40px rgba(4, 27, 61, 0.12);
          }
          .sh-card {
            width: 440px;
            padding: 26px 28px 30px;
            border-radius: 30px;
            background: #ffffff;
            box-shadow: 0 30px 60px rgba(4, 27, 61, 0.14), 0 8px 18px rgba(4, 27, 61, 0.08);
          }
          .sh-card-t {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
          }
          .sh-card-d {
            margin-top: 10px;
            font-size: 34px;
            font-weight: 500;
            line-height: 1.3;
            color: var(--muted, #2f4560);
          }
          .sh-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 1100px;
            height: 92px;
            border-radius: 999px;
            background: linear-gradient(90deg, #041b3d 0%, #007b83 100%);
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            box-shadow: 0 24px 50px rgba(4, 27, 61, 0.28);
          }
          .sh-banner svg {
            display: block;
            width: 40px;
            height: 40px;
          }
          .sh-ch {
            display: inline-block;
          }
        </style>

        <div id="scene-how-clip" class="clip" data-start="0" data-duration="8.6" data-track-index="0">
          <div class="sh-bg"></div>
          <div class="sh-content">
            <h2 class="sh-title">Sin proyectos <span class="sh-accent">eternos.</span></h2>
            <div class="sh-track">
              <div class="sh-line"><div class="sh-line-fill"></div></div>
              <div class="sh-dot" data-layout-allow-overflow="true"></div>
              <div class="sh-step sh-s1" style="left: 0px;">
                <div class="sh-num">1</div>
                <div class="sh-card">
                  <div class="sh-card-t">Elegimos un proceso</div>
                </div>
              </div>
              <div class="sh-step sh-s2" style="left: 530px;">
                <div class="sh-num">2</div>
                <div class="sh-card">
                  <div class="sh-card-t">Lo conectamos y lo ponemos a funcionar</div>
                </div>
              </div>
              <div class="sh-step sh-s3" style="left: 1060px;">
                <div class="sh-num">3</div>
                <div class="sh-card">
                  <div class="sh-card-t">Medimos el retorno</div>
                </div>
              </div>
            </div>
            <div class="sh-banner">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              <span>Empezamos con un piloto, no con una apuesta.</span>
            </div>
          </div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) {
              return root.querySelectorAll(s);
            };
            var el = function (s) {
              return root.querySelector(s);
            };
            var BRAND = "#007b83";
            var tl = gsap.timeline({ paused: true });

            var splitLetters = function (host) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = "sh-ch";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) {
                    walk(n);
                  }
                });
              };
              walk(host);
              return out;
            };

            // after the diagonal wipe the opaque backdrop fades so the layered stage returns
            tl.to(el(".sh-bg"), { autoAlpha: 0, duration: 0.5 }, 0.9);
            // slow camera push-in
            tl.fromTo(el(".sh-content"), { scale: 1 }, { scale: 1.035, duration: 8.6, ease: "none" }, 0);

            // title: letters rise out of a blur, in a wave (arrive with the wipe, no dead air)
            var letters = splitLetters(el(".sh-title"));
            letters.forEach(function (c, i) {
              tl.fromTo(c, { autoAlpha: 0, y: 90, filter: "blur(12px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.1 + i * 0.04);
            });

            // steps: flip in from the side, left to right
            tl.set(q(".sh-line-fill"), { scaleX: 0, transformOrigin: "0% 50%" }, 0);
            tl.fromTo(
              q(".sh-step"),
              { autoAlpha: 0, rotationY: -70, x: -80, transformPerspective: 1200, transformOrigin: "0% 50%" },
              { autoAlpha: 1, rotationY: 0, x: 0, duration: 0.8, stagger: 0.18, ease: "back.out(1.4)" },
              0.5,
            );
            tl.fromTo(el(".sh-line"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 0.8);
            tl.fromTo(el(".sh-dot"), { autoAlpha: 0, x: 0 }, { autoAlpha: 1, x: 0, duration: 0.3 }, 1.6);

            // progress: the dot travels the line, lighting each step as it arrives
            var nums = q(".sh-num");
            var cards = q(".sh-card");
            var stops = [0, 530, 1060];
            var at = [1.8, 3.4, 5.0];
            for (var i = 0; i < 3; i++) {
              var cx = 220 + stops[i] - 150;
              tl.to(el(".sh-dot"), { x: cx, duration: 1.2, ease: "power2.inOut" }, i === 0 ? 1.7 : at[i] - 1.4);
              tl.to(el(".sh-line-fill"), { scaleX: (cx + 0.0) / 1200 > 1 ? 1 : (cx) / 1200, duration: 1.2, ease: "power2.inOut" }, i === 0 ? 1.7 : at[i] - 1.4);
              tl.to(nums[i], { backgroundColor: BRAND, borderColor: BRAND, color: "#ffffff", scale: 1.15, duration: 0.4, ease: "back.out(2.4)" }, at[i]);
              tl.to(nums[i], { scale: 1, duration: 0.3, ease: "power2.out" }, at[i] + 0.4);
              tl.to(cards[i], { y: -14, duration: 0.5, ease: "power2.out" }, at[i]);
            }
            tl.to(el(".sh-dot"), { x: 1200, duration: 0.8, ease: "power2.inOut" }, 5.6);
            tl.to(el(".sh-line-fill"), { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 5.6);

            // closing line: banner springs up
            tl.fromTo(el(".sh-banner"), { autoAlpha: 0, y: 70, scale: 0.7, transformOrigin: "50% 50%" }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "elastic.out(1, 0.55)" }, 6.0);
            tl.fromTo(el(".sh-banner svg"), { x: 0 }, { x: 10, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.0);

            tl.seek(0);
            window.__timelines["scene-how"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
