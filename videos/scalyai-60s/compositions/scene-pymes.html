<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acto 4: hecho para PyMEs</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-pymes" data-width="1920" data-height="1080" data-duration="7.2" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            color: var(--fg, #061a36);
            font-family: var(--font-body, system-ui, sans-serif);
          }
          #scene-pymes-clip {
            position: absolute;
            inset: 0;
          }
          .sp-bg {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(circle at 80% 10%, rgba(66, 207, 210, 0.3), transparent 46%),
              radial-gradient(circle at 10% 92%, rgba(0, 122, 130, 0.2), transparent 46%),
              radial-gradient(ellipse at 50% 38%, #fcfcf8 0%, #f0f0e8 52%, #e2e5da 100%);
          }
          .sp-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 54px;
            padding: 70px 150px;
          }
          .sp-title {
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 108px;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1;
            white-space: nowrap;
          }
          .sp-accent {
            color: var(--brand, #007a82);
          }
          .sp-ch {
            display: inline-block;
          }
          .sp-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 44px;
          }
          .sp-card {
            padding: 36px 44px 38px;
            border-radius: 40px;
            background: #ffffff;
            box-shadow: 0 40px 80px rgba(6, 26, 54, 0.16), 0 10px 22px rgba(6, 26, 54, 0.08);
          }
          .sp-range {
            width: 900px;
          }
          .sp-label {
            font-size: 30px;
            font-weight: 700;
            color: var(--muted, #4f626b);
          }
          .sp-slider {
            position: relative;
            height: 150px;
            margin-top: 14px;
          }
          .sp-rail {
            position: absolute;
            left: 0;
            right: 0;
            top: 66px;
            height: 18px;
            border-radius: 9px;
            background: #dfe4dc;
          }
          .sp-fill {
            position: absolute;
            inset: 0;
            border-radius: 9px;
            background: linear-gradient(90deg, #0e3a5e, #007a82, #42cfd2);
          }
          .sp-thumb {
            position: absolute;
            top: 50px;
            left: 0;
            width: 50px;
            height: 50px;
            margin-left: -25px;
            border-radius: 50%;
            background: #ffffff;
            border: 8px solid #007a82;
            box-shadow: 0 10px 24px rgba(0, 122, 130, 0.4);
          }
          .sp-pin {
            position: absolute;
            top: 0;
            padding: 8px 20px;
            border-radius: 999px;
            background: #061a36;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            white-space: nowrap;
          }
          .sp-ends {
            display: flex;
            justify-content: space-between;
            margin-top: -4px;
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -0.03em;
          }
          .sp-ends small {
            display: block;
            font-family: var(--font-body, system-ui, sans-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0;
            color: var(--muted, #4f626b);
          }
          .sp-price {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 620px;
            background: linear-gradient(135deg, #0e3a5e 0%, #20748c 60%, #42cfd2 130%);
            color: #ffffff;
          }
          .sp-price .sp-label {
            color: #cfeff1;
          }
          .sp-amount {
            margin-top: 6px;
            font-family: var(--font-display, system-ui, sans-serif);
            font-size: 150px;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1;
            white-space: nowrap;
          }
          .sp-roll {
            display: inline-block;
            height: 1.05em;
            overflow: hidden;
            vertical-align: bottom;
          }
          .sp-strip {
            display: flex;
            flex-direction: column;
          }
          .sp-strip > span {
            display: block;
            height: 1.05em;
            line-height: 1.05;
          }
          .sp-cur {
            font-size: 78px;
            letter-spacing: -0.02em;
            opacity: 0.92;
          }
          .sp-chip {
            display: inline-flex;
            align-self: flex-start;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            padding: 10px 24px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            font-size: 28px;
            font-weight: 700;
          }
          .sp-chip svg {
            display: block;
            width: 28px;
            height: 28px;
          }
          .sp-note {
            font-size: 24px;
            font-weight: 600;
            color: var(--muted, #4f626b);
          }
        </style>

        <div id="scene-pymes-clip" class="clip" data-start="0" data-duration="7.2" data-track-index="0">
          <div class="sp-bg"></div>
          <div class="sp-content">
            <h2 class="sp-title">Hecho para <span class="sp-accent">PyMEs.</span></h2>
            <div class="sp-row">
              <div class="sp-card sp-range">
                <div class="sp-label">PyMEs que facturan al mes</div>
                <div class="sp-slider">
                  <div class="sp-pin">Tu negocio</div>
                  <div class="sp-rail"><div class="sp-fill"></div></div>
                  <div class="sp-thumb" data-layout-allow-overflow="true"></div>
                </div>
                <div class="sp-ends">
                  <span>S/10k<small>mínimo</small></span>
                  <span style="text-align:right">S/500k<small>máximo</small></span>
                </div>
              </div>
              <div class="sp-card sp-price">
                <div class="sp-label">Paquetes desde</div>
                <div class="sp-amount"><span class="sp-cur">S/</span><span class="sp-roll" style="margin-right:-0.16em"><span class="sp-strip sp-s1" data-layout-allow-overflow="true"><span>0</span><span>1</span></span></span><span>.</span><span class="sp-roll"><span class="sp-strip sp-s2" data-layout-allow-overflow="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></span></span><span>00</span></div>
                <div class="sp-chip"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7" /></svg>Se empieza con un piloto</div>
              </div>
            </div>
            <div class="sp-note">Referencial: consulta condiciones en scalyai.dev</div>
          </div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) {
              return root.querySelectorAll(s);
            };
            var el = function (s) {
              return root.querySelector(s);
            };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = "sp-ch";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) {
                    walk(n);
                  }
                });
              };
              walk(host);
              return out;
            };

            // after the horizontal opening the opaque backdrop fades so the layered stage returns
            tl.to(el(".sp-bg"), { autoAlpha: 0, duration: 0.5 }, 0.8);
            tl.fromTo(el(".sp-content"), { scale: 1 }, { scale: 1.035, duration: 7.2, ease: "none" }, 0);

            // title: letters land from far away, scaled up, in a random order
            var letters = splitLetters(el(".sp-title"));
            var r = rng(29);
            letters.forEach(function (c) {
              tl.fromTo(c, { autoAlpha: 0, scale: 3.2, rotation: (r() - 0.5) * 50 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.55, ease: "power4.out" }, 0.1 + r() * 0.5);
            });

            // range card: rises with a tilt; the bar fills from 10k to 500k and the thumb follows
            tl.fromTo(el(".sp-range"), { autoAlpha: 0, y: 110, rotationX: -40, transformPerspective: 1200, transformOrigin: "50% 100%" }, { autoAlpha: 1, y: 0, rotationX: 0, duration: 0.8, ease: "power3.out" }, 0.7);
            tl.set(el(".sp-fill"), { scaleX: 0, transformOrigin: "0% 50%" }, 0);
            tl.fromTo(el(".sp-fill"), { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power2.inOut" }, 1.5);
            tl.fromTo(el(".sp-thumb"), { x: 0 }, { x: 812, duration: 2.0, ease: "power2.inOut" }, 1.5);
            tl.set(el(".sp-pin"), { left: "0px" }, 0);
            tl.fromTo(el(".sp-pin"), { autoAlpha: 0, y: 14, x: 0 }, { autoAlpha: 1, y: 0, x: 0, duration: 0.4, ease: "back.out(2)" }, 1.4);
            tl.to(el(".sp-pin"), { x: 700, duration: 2.0, ease: "power2.inOut" }, 1.5);
            tl.to(el(".sp-thumb"), { scale: 1.2, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.5);

            // price card: pops from the right, the amount rolls up to 1.500
            tl.fromTo(el(".sp-price"), { autoAlpha: 0, x: 140, rotationY: 40, transformPerspective: 1200, transformOrigin: "0% 50%" }, { autoAlpha: 1, x: 0, rotationY: 0, duration: 0.85, ease: "back.out(1.4)" }, 1.0);
            tl.fromTo(el(".sp-s1"), { yPercent: 0 }, { yPercent: -50, duration: 0.7, ease: "power3.out" }, 2.0);
            tl.fromTo(el(".sp-s2"), { yPercent: 0 }, { yPercent: -83.333, duration: 1.0, ease: "power3.out" }, 2.0);
            tl.fromTo(el(".sp-chip"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.3);
            tl.fromTo(el(".sp-note"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 3.6);

            // shine on the price card, then both cards float
            tl.to(el(".sp-price"), { y: -10, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.2);
            tl.to(el(".sp-range"), { y: -8, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.5);

            tl.seek(0);
            window.__timelines["scene-pymes"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
