<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cierre: destellos, ondas y llamada a la acción</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="logo-fx" data-width="1920" data-height="1080" data-duration="3.4" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            font-family: var(--font-body, system-ui, sans-serif);
          }
          #logo-fx-clip {
            position: absolute;
            inset: 0;
          }
          .lf-ring {
            position: absolute;
            left: 810px;
            top: 330px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 5px solid #42cfd2;
            opacity: 0;
          }
          .lf-spark {
            position: absolute;
            left: 954px;
            top: 474px;
            border-radius: 50%;
            opacity: 0;
          }
          .lf-shine {
            position: absolute;
            top: -10%;
            left: -30%;
            width: 18%;
            height: 120%;
            background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.75) 50%, transparent 100%);
            mix-blend-mode: soft-light;
          }
          .lf-cta {
            position: absolute;
            left: 50%;
            top: 858px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 780px;
            height: 96px;
            border-radius: 999px;
            background: linear-gradient(90deg, #0e3a5e 0%, #20748c 55%, #42cfd2 100%);
            box-shadow: 0 24px 50px rgba(14, 58, 94, 0.32);
            color: #ffffff;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
          }
          .lf-cta svg {
            display: block;
            width: 36px;
            height: 36px;
          }
          .lf-fine {
            position: absolute;
            left: 50%;
            top: 972px;
            width: 780px;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #3f4f49;
            white-space: nowrap;
          }
        </style>

        <div id="logo-fx-clip" class="clip" data-start="0" data-duration="3.4" data-track-index="0">
          <div class="lf-ring lf-r0" data-layout-allow-overflow="true"></div>
          <div class="lf-ring lf-r1" data-layout-allow-overflow="true"></div>
          <div class="lf-ring lf-r2" data-layout-allow-overflow="true"></div>
          <div class="lf-sparks"></div>
          <div class="lf-shine" data-layout-allow-overflow="true"></div>
          <div class="lf-cta"><span>Conversemos de tu próximo piloto</span><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg></div>
          <div class="lf-fine">30 minutos · sin tarjeta · sin compromiso</div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) {
              return root.querySelectorAll(s);
            };
            var el = function (s) {
              return root.querySelector(s);
            };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };

            // the accent period pops at about 0.95s: shock rings and a spark burst leave from the lockup
            var rings = q(".lf-ring");
            for (var i = 0; i < rings.length; i++) {
              tl.fromTo(rings[i], { scale: 0.3, autoAlpha: 0.9 }, { scale: 4.4, autoAlpha: 0, duration: 1.2, ease: "power2.out" }, 0.95 + i * 0.18);
            }
            var layer = el(".lf-sparks");
            var r = rng(19);
            for (var k = 0; k < 22; k++) {
              var sp = document.createElement("div");
              sp.className = "lf-spark";
              var size = 8 + Math.round(r() * 12);
              sp.style.width = size + "px";
              sp.style.height = size + "px";
              sp.style.background = k % 3 === 0 ? "#007a82" : "#42cfd2";
              layer.appendChild(sp);
              var a = (k / 22) * Math.PI * 2 + r() * 0.3;
              var d = 280 + r() * 420;
              tl.fromTo(sp, { x: 0, y: 0, autoAlpha: 1, scale: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d * 0.6, autoAlpha: 0, scale: 0.2, duration: 0.9 + r() * 0.5, ease: "power3.out" }, 1.0);
            }

            // a light sheen crosses the finished wordmark
            tl.fromTo(el(".lf-shine"), { x: 0 }, { x: 2300, duration: 1.0, ease: "power2.inOut" }, 2.1);

            // the call to action springs up, then the arrow keeps nudging forward
            tl.fromTo(el(".lf-cta"), { autoAlpha: 0, y: 70, scale: 0.7, xPercent: -50, transformOrigin: "50% 50%" }, { autoAlpha: 1, y: 0, scale: 1, xPercent: -50, duration: 0.8, ease: "elastic.out(1, 0.55)" }, 1.9);
            tl.fromTo(el(".lf-cta svg"), { x: 0 }, { x: 10, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.7);
            tl.fromTo(el(".lf-fine"), { autoAlpha: 0, y: 14, xPercent: -50 }, { autoAlpha: 1, y: 0, xPercent: -50, duration: 0.5, ease: "power2.out" }, 2.35);

            tl.seek(0);
            window.__timelines["logo-fx"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
