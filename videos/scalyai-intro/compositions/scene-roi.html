<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Scene 3 — 2 semanas / ROI en 6</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-roi" data-width="1920" data-height="1080" data-duration="2.2" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            color: var(--fg, #f5f7fa);
            font-family: var(--font-display, Inter, system-ui, sans-serif);
          }
          #scene-roi-clip {
            position: absolute;
            inset: 0;
          }
          .sr-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 120px 160px;
            gap: 48px;
            text-align: center;
          }
          .sr-line {
            display: block;
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            white-space: nowrap;
          }
          .sr-num {
            display: inline-block;
            color: var(--brand, #2ee6a8);
          }
          .sr-sub {
            color: var(--muted, #94a3b8);
          }

          /* shimmer-sweep, adapted: the light band runs through the glyphs only */
          .sr-shine {
            background-image: linear-gradient(
              110deg,
              var(--muted, #94a3b8) 0%,
              var(--muted, #94a3b8) 40%,
              #ffffff 50%,
              var(--muted, #94a3b8) 60%,
              var(--muted, #94a3b8) 100%
            );
            background-size: 300% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }
        </style>

        <div id="scene-roi-clip" class="clip" data-start="0" data-duration="2.2" data-track-index="0">
          <div class="sr-content">
            <div class="sr-line sr-line-1">Listo en <span class="sr-num sr-n1">2</span> semanas.</div>
            <div class="sr-line-wrap">
              <div class="sr-line sr-line-2">
                <span class="sr-sub sr-shine">ROI medible en</span> <span class="sr-num sr-n2">6</span><span class="sr-sub">.</span>
              </div>
            </div>
          </div>
        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var el = function (s) {
              return root.querySelector(s);
            };
            var tl = gsap.timeline({ paused: true });

            // slide_bottom + scale_punch on the numbers
            tl.fromTo(el(".sr-line-1"), { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power4.out" }, 0.05);
            tl.fromTo(el(".sr-n1"), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.3);
            tl.fromTo(el(".sr-line-wrap"), { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power4.out" }, 0.65);
            tl.fromTo(el(".sr-n2"), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.9);
            // glow on the beat
            tl.fromTo(
              root.querySelectorAll(".sr-num"),
              { textShadow: "0 0 0px rgba(46,230,168,0)" },
              { textShadow: "0 0 46px rgba(46,230,168,0.75)", duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" },
              1.15,
            );
            // shimmer-sweep across line 2
            tl.fromTo(el(".sr-shine"), { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut" }, 1.25);
            // exit: scale_out
            tl.fromTo(el(".sr-content"), { autoAlpha: 1, scale: 1 }, { autoAlpha: 0, scale: 1.06, duration: 0.3, ease: "power2.in", immediateRender: false }, 1.9);

            tl.seek(0);
            window.__timelines["scene-roi"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
