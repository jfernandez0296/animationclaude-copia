<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 3.14.2, vendored so renders work offline -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-500-latin.woff2") format("woff2");
        font-weight: 500 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-800-latin.woff2") format("woff2");
        font-weight: 800 900;
        font-style: normal;
      }

      /* ScalyAI brand palette (sampled from scalyai.dev) — the one place colors live */
      :root {
        --bg: transparent; /* logo-brand-close paints var(--bg); keep the stage visible */
        --stage: #f0f0e8; /* cream page background */
        --fg: #061a36; /* navy headings */
        --muted: #4f626b; /* slate body copy */
        --brand: #007a82; /* teal accent */
        --accent: #42cfd2; /* cyan end of the CTA gradient */
        --accent-2: #20748c;
        --navy-2: #0e3a5e; /* navy start of the CTA gradient */
        --pill: #ffffff;
        --pill-line: #d6dbd2;
        --font-display: "Manrope", ui-sans-serif, system-ui, sans-serif;
        --font-body: "Manrope", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--stage);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--font-body);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- track 0: layered stage (orbs, perspective floor, rings, dust) -->
      <div
        id="stage-bg"
        data-composition-id="stage-bg"
        data-composition-src="compositions/stage-bg.html"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 1 · 0.0–5.0  El problema: 11:40 p. m., un mensaje sin respuesta -->
      <div
        id="scene-night"
        data-composition-id="scene-night"
        data-composition-src="compositions/scene-night.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 2 · 4.3–10.5  El cambio: del caos manual a las tareas que se hacen solas -->
      <div
        id="scene-auto-tasks"
        data-composition-id="scene-auto-tasks"
        data-composition-src="compositions/scene-auto-tasks.html"
        data-start="4.3"
        data-duration="6.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 2 · 9.9–14.9  Mismo mensaje, ahora con respuesta (chatbot en el celular) -->
      <div
        id="scene-tools"
        data-composition-id="scene-tools"
        data-composition-src="compositions/scene-tools.html"
        data-start="9.9"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 3 · 14.4–20.1  La automatización: un solo flujo para el pedido #1042 -->
      <div
        id="scene-workflow"
        data-composition-id="scene-workflow"
        data-composition-src="compositions/scene-workflow.html"
        data-start="14.4"
        data-duration="5.7"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 4 · 19.5–24.3  A la mañana, todo se mide -->
      <div
        id="scene-dashboard"
        data-composition-id="scene-dashboard"
        data-composition-src="compositions/scene-dashboard.html"
        data-start="19.5"
        data-duration="4.8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 4 · 23.7–26.65  La promesa: 2 semanas / ROI en 6 -->
      <div
        id="scene-roi"
        data-composition-id="scene-roi"
        data-composition-src="compositions/scene-roi.html"
        data-start="23.7"
        data-duration="2.95"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 26.25–27.05  brand wipe: the site CTA gradient hands off to the logo -->
      <div
        id="brand-wipe"
        data-composition-id="brand-wipe"
        data-composition-src="compositions/brand-wipe.html"
        data-start="26.25"
        data-duration="0.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- ACT 5 · 26.6–30.0  Tu turno: logo, lema y llamada a la acción -->
      <div
        id="logo-brand-close"
        data-composition-id="logo-brand-close"
        data-composition-src="compositions/components/logo-brand-close.html"
        data-variable-values='{"wordmark":"ScalyAI","tagline":"Software e IA a la medida de tu negocio","url":"scalyai.dev","accent":"green","exit":"none"}'
        data-start="26.6"
        data-duration="3.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="logo-fx"
        data-composition-id="logo-fx"
        data-composition-src="compositions/logo-fx.html"
        data-start="26.6"
        data-duration="3.4"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- the story thread: chapter chip + progress bar, on top of everything -->
      <div
        id="story-chrome"
        data-composition-id="story-chrome"
        data-composition-src="compositions/story-chrome.html"
        data-start="0"
        data-duration="30"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      // Scene motion lives in the sub-compositions; the main timeline owns only the
      // scene-to-scene transitions, tweening the host slots while they overlap.
      // Six different transitions, so no two neighbouring cuts feel the same.
      const tl = gsap.timeline({ paused: true });

      // 1 · night -> day (4.3–5.0): the sun rises from the moon's corner as a circular reveal.
      tl.fromTo(
        "#scene-auto-tasks",
        { clipPath: "circle(0% at 87% 15%)" },
        { clipPath: "circle(150% at 87% 15%)", duration: 0.7, ease: "power2.inOut" },
        4.3,
      );

      // 2 · tasks -> chatbot (9.9–10.4): zoom-through. The old scene swells and blurs away,
      //     the new one settles in from slightly smaller.
      tl.to("#scene-auto-tasks", { scale: 1.12, opacity: 0, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, 9.9);
      tl.fromTo(
        "#scene-tools",
        { scale: 0.9, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        9.9,
      );

      // 3 · chatbot -> flow (14.4–14.85): push left with motion blur on both frames.
      tl.to("#scene-tools", { x: -1920, filter: "blur(10px)", duration: 0.45, ease: "power3.inOut" }, 14.4);
      tl.fromTo(
        "#scene-workflow",
        { x: 1920, filter: "blur(10px)" },
        { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.inOut" },
        14.4,
      );

      // 4 · flow -> morning dashboard (19.5–20.1): circular reveal growing from the centre.
      tl.fromTo(
        "#scene-dashboard",
        { clipPath: "circle(0% at 50% 55%)" },
        { clipPath: "circle(150% at 50% 55%)", duration: 0.6, ease: "power2.inOut" },
        19.5,
      );

      // 5 · dashboard -> promise (23.7–24.15): push down, the ROI scene drops in from the top.
      tl.to("#scene-dashboard", { y: 1080, filter: "blur(10px)", duration: 0.45, ease: "power3.inOut" }, 23.7);
      tl.fromTo(
        "#scene-roi",
        { y: -1080, filter: "blur(10px)" },
        { y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.inOut" },
        23.7,
      );

      // 6 · promise -> logo (26.25–27.05): brand-wipe covers the frame at 26.6; the ROI
      //     frame drifts right under it and the logo lockup settles in as it clears.
      tl.to("#scene-roi", { x: 160, scale: 0.96, duration: 0.35, ease: "power3.in" }, 26.25);
      tl.fromTo(
        "#logo-brand-close",
        { x: -120, scale: 1.04 },
        { x: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        26.6,
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
