<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 3.14.2, vendored so renders work offline -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-500-latin.woff2") format("woff2");
        font-weight: 500 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/Manrope-800-latin.woff2") format("woff2");
        font-weight: 800 900;
        font-style: normal;
      }

      /* ScalyAI brand palette (sampled from scalyai.dev) — the one place colors live */
      :root {
        --bg: transparent; /* logo-brand-close paints var(--bg); keep the stage visible */
        --stage: #f0f0e8; /* cream page background */
        --fg: #061a36; /* navy headings */
        --muted: #4f626b; /* slate body copy */
        --brand: #007a82; /* teal accent */
        --accent: #42cfd2; /* cyan end of the CTA gradient */
        --accent-2: #20748c;
        --navy-2: #0e3a5e; /* navy start of the CTA gradient */
        --pill: #ffffff;
        --pill-line: #d6dbd2;
        --font-display: "Manrope", ui-sans-serif, system-ui, sans-serif;
        --font-body: "Manrope", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--stage);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--font-body);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- track 0: stage (grid + drifting glow) -->
      <div
        id="stage-bg"
        data-composition-id="stage-bg"
        data-composition-src="compositions/stage-bg.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 0.0–2.2 hook (registry: headline-slam) -->
      <div
        id="headline-slam"
        data-composition-id="headline-slam"
        data-composition-src="compositions/components/headline-slam.html"
        data-variable-values='{"text":"¿Todo a mano?","accent_word_index":2,"accent":"green","shadow":false}'
        data-start="0"
        data-duration="2.3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 1.8–4.8 build: tools get connected (push-up in, overlapping the hook's whip-out) -->
      <div
        id="scene-tools"
        data-composition-id="scene-tools"
        data-composition-src="compositions/scene-tools.html"
        data-start="1.8"
        data-duration="3"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 4.35–6.95 punch: 2 semanas / ROI en 6 (push-left in) -->
      <div
        id="scene-roi"
        data-composition-id="scene-roi"
        data-composition-src="compositions/scene-roi.html"
        data-start="4.35"
        data-duration="2.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 6.55–7.35 brand wipe: the site's CTA gradient sweeps across and hands off to the logo -->
      <div
        id="brand-wipe"
        data-composition-id="brand-wipe"
        data-composition-src="compositions/brand-wipe.html"
        data-start="6.55"
        data-duration="0.8"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- 6.9–10.0 resolve (registry: logo-brand-close), revealed as the wipe leaves -->
      <div
        id="logo-brand-close"
        data-composition-id="logo-brand-close"
        data-composition-src="compositions/components/logo-brand-close.html"
        data-variable-values='{"wordmark":"ScalyAI","tagline":"Software e IA a la medida de tu negocio","url":"scalyai.dev","accent":"green","exit":"none"}'
        data-start="6.9"
        data-duration="3.1"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      // Scene motion lives in the sub-compositions; the main timeline owns only the
      // scene-to-scene transitions, tweening the host slots while they overlap.
      const tl = gsap.timeline({ paused: true });

      // 1 · hook → tools (1.8–2.3): push up with motion blur on both frames.
      tl.to("#headline-slam", { y: -1080, filter: "blur(10px)", duration: 0.5, ease: "power3.inOut" }, 1.8);
      tl.fromTo(
        "#scene-tools",
        { y: 1080, filter: "blur(10px)" },
        { y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.inOut" },
        1.8,
      );

      // 2 · tools → ROI (4.35–4.8): push left with motion blur on both frames.
      tl.to("#scene-tools", { x: -1920, filter: "blur(10px)", duration: 0.45, ease: "power3.inOut" }, 4.35);
      tl.fromTo(
        "#scene-roi",
        { x: 1920, filter: "blur(10px)" },
        { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.inOut" },
        4.35,
      );

      // 3 · ROI → logo (6.55–7.35): brand-wipe covers the frame at 6.9; the ROI
      //     frame drifts right under it and the logo lockup settles in as it clears.
      tl.to("#scene-roi", { x: 160, scale: 0.96, duration: 0.35, ease: "power3.in" }, 6.55);
      tl.fromTo(
        "#logo-brand-close",
        { x: -120, scale: 1.04 },
        { x: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        6.9,
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
