<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 4: para ti</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-parati" data-width="1920" data-height="1080" data-duration="6.5" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: var(--ink, #170b2e); font-family: var(--font-body, system-ui, sans-serif); }
          .scene { position: absolute; inset: 0; }
          .content { position: absolute; inset: 0; }
          h1, h2, h3, p { margin: 0; }
          .disp { font-family: var(--font-display, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
          .grad { background: linear-gradient(90deg, #5421a6 0%, #7c3aed 45%, #b5249f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
          .card { background: #ffffff; border-radius: 40px; box-shadow: 0 40px 80px rgba(60, 20, 120, 0.16), 0 10px 22px rgba(60, 20, 120, 0.08); }
          .eyebrow { display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: #efe3ff; color: #5421a6; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

          .p-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; padding-left: 220px; }
          .p-row { display: flex; align-items: center; gap: 36px; }
          .p-w { font-family: var(--font-display, system-ui, sans-serif); font-size: 190px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; white-space: nowrap; }
          .p-ico { width: 150px; height: 150px; border-radius: 46px; background: linear-gradient(135deg, #5421a6, #d74ac5); display: flex; align-items: center; justify-content: center; box-shadow: 0 26px 54px rgba(84, 33, 166, 0.35); }
          .p-ico svg { display: block; width: 84px; height: 84px; }
          .p-pill { margin-top: 28px; padding: 18px 56px; border-radius: 999px; background: #ffffff; box-shadow: 0 24px 54px rgba(60, 20, 120, 0.2); font-size: 58px; font-weight: 700; margin-left: 186px; }
          .p-pill b { color: #5421a6; }

        </style>

        <div id="scene-parati-clip" class="clip scene" data-start="0" data-duration="6.5" data-track-index="0">

          <div class="content p-wrap">
            <div class="p-row"><span class="p-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l3-1 8-8a3 3 0 00-4-4l-8 8-1 3zM14 6l4 4M15 13l5 5"/></svg></span><span class="p-w" style="color:#5421a6">Emprendedoras.</span></div><div class="p-row"><span class="p-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="p-w" style="color:#b5249f">Profesionales.</span></div><div class="p-row"><span class="p-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c1-4 3-6 7-6s6 2 7 6M16 14c3 0 5 2 6 5"/></svg></span><span class="p-w" style="color:#170b2e">Consultoras.</span></div>
            <div class="p-pill"><b>Sin experiencia técnica.</b> 100% no code</div>
          </div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            var rows = q(".p-row");
            for (var i = 0; i < rows.length; i++) {
              var side = i % 2 ? 1 : -1;
              tl.fromTo(rows[i], { x: side * 1400, autoAlpha: 0, skewX: side * -18 }, { x: 0, autoAlpha: 1, skewX: 0, duration: 0.9, ease: "power4.out" }, 0.2 + i * 0.7);
              tl.fromTo(rows[i].querySelector(".p-ico"), { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(2)" }, 0.6 + i * 0.7);
              tl.to(rows[i], { x: 18, duration: 1.4 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.6 + i * 0.1);
            }
            tl.fromTo(el(".p-pill"), { autoAlpha: 0, y: 70, scale: 0.7 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.8, ease: "elastic.out(1, 0.55)" }, 2.7);
            tl.fromTo(el(".p-wrap"), { scale: 1 }, { scale: 1.035, duration: 6.5, ease: "none" }, 0);

            tl.seek(0);
            window.__timelines["scene-parati"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
