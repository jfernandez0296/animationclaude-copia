<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 6: precio</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-precio" data-width="1920" data-height="1080" data-duration="6.0" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: var(--ink, #170b2e); font-family: var(--font-body, system-ui, sans-serif); }
          .scene { position: absolute; inset: 0; }
          .content { position: absolute; inset: 0; }
          h1, h2, h3, p { margin: 0; }
          .disp { font-family: var(--font-display, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
          .grad { background: linear-gradient(90deg, #5421a6 0%, #7c3aed 45%, #b5249f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
          .card { background: #ffffff; border-radius: 40px; box-shadow: 0 40px 80px rgba(60, 20, 120, 0.16), 0 10px 22px rgba(60, 20, 120, 0.08); }
          .eyebrow { display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: #efe3ff; color: #5421a6; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

          .e-rays { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
          .e-ray { position: absolute; left: -10px; top: -1400px; width: 20px; height: 1400px; transform-origin: 10px 1400px; background: linear-gradient(180deg, rgba(196, 166, 255, 0), rgba(196, 166, 255, 0.35)); }
          .e-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
          .e-tag { font-size: 44px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5421a6; }
          .e-old { font-size: 50px; font-weight: 500; color: #4b4560; text-decoration: line-through; text-decoration-thickness: 5px; }
          .e-price { font-family: var(--font-display, system-ui, sans-serif); font-size: 380px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; color: #5421a6; }
          .e-badge { margin-top: 10px; padding: 16px 56px; border-radius: 999px; background: linear-gradient(90deg, #5421a6, #b5249f); color: #ffffff; font-size: 62px; font-weight: 700; box-shadow: 0 26px 54px rgba(84, 33, 166, 0.4); white-space: nowrap; }
          .e-usd { font-size: 46px; font-weight: 700; color: #170b2e; }
          .coin { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #f5b82e 60%, #c98a0c); border: 4px solid #e8a720; opacity: 0; }

        </style>

        <div id="scene-precio-clip" class="clip scene" data-start="0" data-duration="6.0" data-track-index="0">

          <div class="e-rays" data-layout-allow-overflow="true"><div class="e-ray" style="transform:rotate(0deg)"></div><div class="e-ray" style="transform:rotate(15deg)"></div><div class="e-ray" style="transform:rotate(30deg)"></div><div class="e-ray" style="transform:rotate(45deg)"></div><div class="e-ray" style="transform:rotate(60deg)"></div><div class="e-ray" style="transform:rotate(75deg)"></div><div class="e-ray" style="transform:rotate(90deg)"></div><div class="e-ray" style="transform:rotate(105deg)"></div><div class="e-ray" style="transform:rotate(120deg)"></div><div class="e-ray" style="transform:rotate(135deg)"></div><div class="e-ray" style="transform:rotate(150deg)"></div><div class="e-ray" style="transform:rotate(165deg)"></div><div class="e-ray" style="transform:rotate(180deg)"></div><div class="e-ray" style="transform:rotate(195deg)"></div><div class="e-ray" style="transform:rotate(210deg)"></div><div class="e-ray" style="transform:rotate(225deg)"></div><div class="e-ray" style="transform:rotate(240deg)"></div><div class="e-ray" style="transform:rotate(255deg)"></div><div class="e-ray" style="transform:rotate(270deg)"></div><div class="e-ray" style="transform:rotate(285deg)"></div><div class="e-ray" style="transform:rotate(300deg)"></div><div class="e-ray" style="transform:rotate(315deg)"></div><div class="e-ray" style="transform:rotate(330deg)"></div><div class="e-ray" style="transform:rotate(345deg)"></div></div>
          <div class="content e-content">
            <div class="e-tag">Pack completo · 8 semanas</div>
            <div class="e-old">Por separado: S/ 598</div>
            <div class="e-price"><span class="e-cur">S/ </span><span class="e-num">499</span></div>
            <div class="e-usd">USD 135 · pago único</div>
            <div class="e-badge">Ahorras S/ 99</div>
          </div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            var r = rng(41);
            tl.fromTo(el(".e-rays"), { rotation: 0, autoAlpha: 0 }, { rotation: 40, autoAlpha: 1, duration: 6, ease: "none" }, 0);
            tl.fromTo(el(".e-tag"), { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
            tl.fromTo(el(".e-old"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 0.5);
            var obj = { v: 0 }; var num = el(".e-num");
            tl.fromTo(el(".e-price"), { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "back.out(1.7)" }, 0.6);
            tl.to(obj, { v: 499, duration: 1.6, ease: "power3.out", onUpdate: function () { num.textContent = String(Math.round(obj.v)); } }, 0.7);
            tl.fromTo(el(".e-usd"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 2.1);
            tl.fromTo(el(".e-badge"), { autoAlpha: 0, scale: 0.3, rotation: -10 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "elastic.out(1, 0.5)" }, 2.3);
            tl.to(el(".e-badge"), { scale: 1.06, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.3);
            var host = el(".e-content");
            for (var c = 0; c < 18; c++) {
              var d = document.createElement("div"); d.className = "coin";
              d.style.left = (900 + r() * 120) + "px"; d.style.top = "380px";
              host.appendChild(d);
              var a = -Math.PI / 2 + (r() - 0.5) * 2.2, dist = 260 + r() * 340;
              tl.set(d, { autoAlpha: 0 }, 0);
              tl.fromTo(d, { x: 0, y: 0, autoAlpha: 1, rotation: 0 }, { x: Math.cos(a) * dist, y: Math.sin(a) * dist + 420, autoAlpha: 0, rotation: 360 * (r() > 0.5 ? 1 : -1), duration: 1.5, ease: "power2.out", immediateRender: false }, 2.4 + r() * 0.3);
            }
            tl.fromTo(el(".e-content"), { scale: 1 }, { scale: 1.04, duration: 6, ease: "none" }, 0);

            tl.seek(0);
            window.__timelines["scene-precio"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
