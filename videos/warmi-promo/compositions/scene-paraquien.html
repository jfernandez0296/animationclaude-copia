<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 4: para quién</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scene-paraquien" data-width="1920" data-height="1080" data-duration="6.5" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: var(--ink, #170b2e); font-family: var(--font-body, system-ui, sans-serif); }
          .scene { position: absolute; inset: 0; }
          .content { position: absolute; inset: 0; }
          h1, h2, h3, p { margin: 0; }
          .disp { font-family: var(--font-display, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
          .grad { background: linear-gradient(90deg, #5421a6 0%, #7c3aed 45%, #b5249f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
          .card { background: #ffffff; border-radius: 40px; box-shadow: 0 40px 80px rgba(60, 20, 120, 0.16), 0 10px 22px rgba(60, 20, 120, 0.08); }
          .eyebrow { display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: #efe3ff; color: #5421a6; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

          .a-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 70px; }
          .a-title { font-size: 112px; text-align: center; white-space: nowrap; }
          .a-row { display: flex; gap: 36px; }
          .a-card { width: 410px; height: 470px; padding: 40px 38px; display: flex; flex-direction: column; gap: 22px; border-radius: 40px; }
          .a-ico { width: 96px; height: 96px; border-radius: 30px; background: linear-gradient(135deg, #5421a6, #d74ac5); display: flex; align-items: center; justify-content: center; color: #fff; }
          .a-ico svg { display: block; width: 52px; height: 52px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
          .a-t { font-family: var(--font-display, system-ui, sans-serif); font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; }
          .a-d { font-size: 36px; font-weight: 500; line-height: 1.3; color: #4b4560; }

        </style>

        <div id="scene-paraquien-clip" class="clip scene" data-start="0" data-duration="6.5" data-track-index="0">

          <div class="content a-content">
            <h2 class="disp a-title">¿Para quién <span class="grad">es?</span></h2>
            <div class="a-row"><div class="card a-card"><div class="a-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></div><div class="a-t">Emprendedoras</div><div class="a-d">Que quieren construir sin depender de terceros</div></div><div class="card a-card"><div class="a-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="a-t">Profesionales</div><div class="a-d">Que buscan automatizar tareas de su día a día</div></div><div class="card a-card"><div class="a-ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c1-4 3-6 7-6s6 2 7 6M16 14c3 0 5 2 6 5"/></svg></div><div class="a-t">Freelancers y consultoras</div><div class="a-d">Que quieren ofrecer más valor con IA</div></div><div class="card a-card"><div class="a-ico"><svg viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg></div><div class="a-t">Sin experiencia técnica</div><div class="a-d">Todo el programa es 100% no code</div></div></div>
          </div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            tl.fromTo(el(".a-content"), { scale: 1 }, { scale: 1.03, duration: 6.5, ease: "none" }, 0);
            var ls = splitLetters(el(".a-title"), "a-ch");
            ls.forEach(function (c, i) { tl.fromTo(c, { autoAlpha: 0, rotationX: -90, y: 30, transformPerspective: 800 }, { autoAlpha: 1, rotationX: 0, y: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.15 + i * 0.045); });
            var cs = q(".a-card");
            for (var i = 0; i < cs.length; i++) {
              tl.fromTo(cs[i], { autoAlpha: 0, rotationY: 80, x: 60, transformPerspective: 1200, transformOrigin: "0% 50%" }, { autoAlpha: 1, rotationY: 0, x: 0, duration: 0.8, ease: "back.out(1.3)" }, 0.8 + i * 0.35);
              tl.to(cs[i], { y: -12, duration: 1.4 + i * 0.15, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.4 + i * 0.1);
            }

            tl.seek(0);
            window.__timelines["scene-paraquien"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
