<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Escena 2: el programa</title>

  <body>
    <template>
      <div id="root" data-composition-id="scene-programa" data-width="1920" data-height="1080" data-duration="7.0" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: var(--ink, #170b2e); font-family: var(--font-body, system-ui, sans-serif); }
          .scene { position: absolute; inset: 0; }
          .content { position: absolute; inset: 0; }
          h1, h2, h3, p { margin: 0; }
          .disp { font-family: var(--font-display, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
          .grad { background: linear-gradient(90deg, #5421a6 0%, #7c3aed 45%, #b5249f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
          .card { background: #ffffff; border-radius: 40px; box-shadow: 0 40px 80px rgba(60, 20, 120, 0.16), 0 10px 22px rgba(60, 20, 120, 0.08); }
          .eyebrow { display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: #efe3ff; color: #5421a6; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

          .wl { display: flex; align-items: center; gap: 18px; }
          .wl-badge { display: block; width: 76px; height: 76px; flex: 0 0 76px; }
          .wl-name { font-family: var(--font-display, system-ui, sans-serif); font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
          .wl-by { font-size: 28px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #4b4560; margin-left: 4px; }

          .p-bg { position: absolute; inset: 0; background: radial-gradient(circle at 12% 8%, rgba(196,166,255,0.55), transparent 48%), radial-gradient(circle at 92% 92%, rgba(127,240,211,0.45), transparent 46%), radial-gradient(ellipse at 50% 40%, #ffffff 0%, #faf7ff 55%, #efe7fb 100%); }
          .p-left { position: absolute; left: 110px; top: 130px; width: 900px; display: flex; flex-direction: column; gap: 34px; align-items: flex-start; }
          .p-title { font-size: 104px; }
          .p-checks { display: flex; flex-direction: column; gap: 16px; }
          .p-check { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; }
          .p-check i { display: block; width: 44px; height: 44px; border-radius: 50%; background: #7c3aed; flex: 0 0 44px; position: relative; }
          .p-check i::after { content: ""; position: absolute; left: 14px; top: 8px; width: 11px; height: 20px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); }
          .p-viz { position: absolute; left: 1100px; top: 150px; width: 700px; height: 760px; }
          .p-ring { position: absolute; left: 30px; top: 60px; width: 640px; height: 640px; overflow: visible; }
          .p-center { position: absolute; left: 30px; top: 60px; width: 640px; height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
          .p-num { font-family: var(--font-display, system-ui, sans-serif); font-size: 300px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.95; color: #5421a6; }
          .p-weeks { font-family: var(--font-display, system-ui, sans-serif); font-size: 62px; font-weight: 700; letter-spacing: -0.02em; color: #170b2e; }
          .p-badge { position: absolute; width: 132px; height: 132px; border-radius: 42px; background: #ffffff; box-shadow: 0 30px 60px rgba(60, 20, 120, 0.22), 0 8px 18px rgba(60, 20, 120, 0.1); display: flex; align-items: center; justify-content: center; color: #5421a6; }
          .p-badge svg { display: block; width: 70px; height: 70px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        </style>

        <div id="scene-programa-clip" class="clip scene" data-start="0" data-duration="7.0" data-track-index="0">

          <div class="p-bg"></div>
          <div class="content">
            <div class="p-left">
              <div class="wl"><svg class="wl-badge" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="WG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5421a6"/><stop offset="1" stop-color="#d74ac5"/></linearGradient></defs><circle cx="24" cy="24" r="24" fill="url(#WG2)"/><path d="M24 11l2.6 8.4L35 22l-8.4 2.6L24 33l-2.6-8.4L13 22l8.4-2.6z" fill="#fff"/><path d="M35 29l1.1 3.4 3.4 1.1-3.4 1.1L35 38l-1.1-3.4-3.4-1.1 3.4-1.1z" fill="#fff"/></svg><span class="wl-name">Warmi <span class="grad">Academy</span></span><span class="wl-by">by Warmi Ventures</span></div>
              <h1 class="disp p-title">Aprende a usar la IA y <span class="grad">automatiza tu trabajo en 8 semanas</span></h1>
              <div class="p-checks"><div class="p-check"><i></i>100% sin código</div><div class="p-check"><i></i>Clases en vivo y grabaciones</div></div>
            </div>
            <div class="p-viz">
              <svg class="p-ring" viewBox="0 0 640 640" aria-hidden="true">
                <defs><linearGradient id="pvg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5421a6"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#b5249f"/></linearGradient></defs>
                <circle cx="320" cy="320" r="270" fill="none" stroke="#e7dcfa" stroke-width="30"/>
                <circle class="p-arc" cx="320" cy="320" r="270" fill="none" stroke="url(#pvg)" stroke-width="30" stroke-linecap="round" transform="rotate(-90 320 320)"/>
                <circle class="p-dot" cx="510.9" cy="129.1" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="590.0" cy="320.0" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="510.9" cy="510.9" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="320.0" cy="590.0" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="129.1" cy="510.9" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="50.0" cy="320.0" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="129.1" cy="129.1" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/><circle class="p-dot" cx="320.0" cy="50.0" r="17" fill="#ffffff" stroke="#7c3aed" stroke-width="8"/>
              </svg>
              <div class="p-center"><div class="p-num">8</div><div class="p-weeks">semanas</div></div>
              <div class="p-badge pb1" style="left: 0px; top: 40px"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 16l.8 2.2 2.2.8-2.2.8L19 22l-.8-2.2-2.2-.8 2.2-.8z"/></svg></div>
              <div class="p-badge pb2" style="left: 540px; top: 150px"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12l-6 5M12 12l6 5"/></svg></div>
              <div class="p-badge pb3" style="left: 500px; top: 600px"><svg viewBox="0 0 24 24"><path d="M5 19l3-1 8-8a3 3 0 00-4-4l-8 8-1 3zM14 6l4 4M15 13l5 5"/></svg></div>
            </div>
          </div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            tl.to(el(".p-bg"), { autoAlpha: 0, duration: 0.6 }, 0.9);
            tl.fromTo(el(".content"), { scale: 1 }, { scale: 1.035, duration: 7, ease: "none" }, 0);
            tl.fromTo(el(".wl"), { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.3);
            var ls = splitLetters(el(".p-title"), "p-ch");
            ls.forEach(function (c, i) {
              tl.fromTo(c, { autoAlpha: 0, y: 70, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.5 + i * 0.022);
            });
            tl.fromTo(q(".p-check"), { autoAlpha: 0, x: -50 }, { autoAlpha: 1, x: 0, duration: 0.6, stagger: 0.25, ease: "back.out(1.6)" }, 2.6);
            tl.fromTo(el(".p-viz"), { autoAlpha: 0, scale: 0.7, rotation: -10 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.5)" }, 0.8);
            var arc = el(".p-arc"); var CIRC = 2 * Math.PI * 270;
            tl.set(arc, { strokeDasharray: CIRC, strokeDashoffset: CIRC }, 0);
            tl.to(arc, { strokeDashoffset: 0, duration: 2.4, ease: "power2.inOut" }, 1.4);
            var dots = q(".p-dot");
            tl.set(dots, { scale: 0, transformOrigin: "50% 50%" }, 0);
            for (var d = 0; d < dots.length; d++) tl.to(dots[d], { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 1.4 + (d + 1) * 0.3);
            tl.fromTo(el(".p-num"), { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.8, ease: "back.out(1.8)" }, 1.2);
            tl.fromTo(el(".p-weeks"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.8);
            var bs = q(".p-badge");
            for (var b = 0; b < bs.length; b++) {
              tl.fromTo(bs[b], { autoAlpha: 0, scale: 0.3, rotation: b % 2 ? 14 : -14 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.9)" }, 2.0 + b * 0.35);
              tl.to(bs[b], { y: -16, duration: 1.4 + b * 0.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.0 + b * 0.1);
            }
            tl.to(el(".p-viz"), { rotation: 2, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.5);

            tl.seek(0);
            window.__timelines["scene-programa"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
