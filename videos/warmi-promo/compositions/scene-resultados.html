<!doctype html>

  <body>
    <template>
      <div id="root" data-composition-id="scene-resultados" data-width="1920" data-height="1080" data-duration="7.5" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; color: var(--ink, #170b2e); font-family: var(--font-body, system-ui, sans-serif); }
          .scene { position: absolute; inset: 0; }
          .content { position: absolute; inset: 0; }
          h1, h2, h3, p { margin: 0; }
          .disp { font-family: var(--font-display, system-ui, sans-serif); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
          .grad { background: linear-gradient(90deg, #5421a6 0%, #7c3aed 45%, #b5249f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
          .card { background: #ffffff; border-radius: 40px; box-shadow: 0 40px 80px rgba(60, 20, 120, 0.16), 0 10px 22px rgba(60, 20, 120, 0.08); }
          .eyebrow { display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: #efe3ff; color: #5421a6; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

          .r-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 50px; }
          .r-title { font-size: 100px; text-align: center; white-space: nowrap; }
          .r-grid { display: grid; grid-template-columns: 820px 820px; gap: 40px; }
          .r-card { padding: 36px 44px 38px; border-radius: 36px; display: flex; flex-direction: column; gap: 16px; }
          .r-ico { width: 84px; height: 84px; border-radius: 26px; background: #efe3ff; display: flex; align-items: center; justify-content: center; color: #5421a6; }
          .r-ico svg { display: block; width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
          .r-t { font-family: var(--font-display, system-ui, sans-serif); font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
          .r-tools { align-self: flex-start; padding: 8px 22px; border-radius: 999px; background: #f4eeff; color: #5421a6; font-size: 30px; font-weight: 700; }

        </style>

        <div id="scene-resultados-clip" class="clip scene" data-start="0" data-duration="7.5" data-track-index="0">

          <div class="content r-content">
            <h2 class="disp r-title">En 8 semanas vas a <span class="grad">lograr esto</span></h2>
            <div class="r-grid"><div class="card r-card"><div class="r-ico"><svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 00-3 3v1a3 3 0 00-2 5 3 3 0 002 5 3 3 0 003 3h1V3zM15 3a3 3 0 013 3v1a3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-3 3h-1V3z"/></svg></div><div class="r-t">IA aplicada a tu trabajo o negocio</div><div class="r-tools">ChatGPT · Gemini · Perplexity · NotebookLM</div></div><div class="card r-card"><div class="r-ico"><svg viewBox="0 0 24 24"><path d="M5 19l3-1 8-8a3 3 0 00-4-4l-8 8-1 3zM14 6l4 4M15 13l5 5"/></svg></div><div class="r-t">Tu MVP publicado</div><div class="r-tools">Lovable · v0</div></div><div class="card r-card"><div class="r-ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M10 6.5h4a3 3 0 013 3V14"/></svg></div><div class="r-t">Automatizaciones funcionando</div><div class="r-tools">Make · Webhooks</div></div><div class="card r-card"><div class="r-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12l-6 5M12 12l6 5"/></svg></div><div class="r-t">IA dentro de tus automatizaciones</div><div class="r-tools">n8n · Claude · APIs</div></div></div>
          </div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            tl.fromTo(el(".r-content"), { scale: 1 }, { scale: 1.03, duration: 7.5, ease: "none" }, 0);
            var ls = splitLetters(el(".r-title"), "r-ch");
            ls.forEach(function (c, i) { tl.fromTo(c, { autoAlpha: 0, scale: 0.2, y: 40 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.2 + i * 0.03); });
            var cs = q(".r-card");
            for (var i = 0; i < cs.length; i++) {
              tl.fromTo(cs[i], { autoAlpha: 0, y: 130, rotationX: -50, transformPerspective: 1200, transformOrigin: "50% 100%" }, { autoAlpha: 1, y: 0, rotationX: 0, duration: 0.8, ease: "back.out(1.4)" }, 0.9 + i * 0.5);
              tl.to(cs[i], { y: -10, duration: 1.5 + i * 0.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.6 + i * 0.1);
              tl.fromTo(cs[i].querySelector(".r-tools"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.5 + i * 0.5);
            }

            tl.seek(0);
            window.__timelines["scene-resultados"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
