          .o-row { position: relative; display: flex; align-items: flex-start; gap: 36px; }
          .o-num { flex: 0 0 120px; width: 120px; height: 120px; border-radius: 50%; background: #ffffff; border: 8px solid #7c3aed; color: #5421a6; font-family: var(--font-display, system-ui, sans-serif); font-size: 70px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(60, 20, 120, 0.2); }
          .o-body { display: flex; flex-direction: column; gap: 14px; }

        </style>

          <div class="content"><div class="o-list"><div class="o-line"><div class="o-fill"></div></div><div class="o-row"><div class="o-num">1</div><div class="o-body"><div class="o-lab">APRENDE</div><div class="o-chips"><div class="tchip" ><i style="background:#7c3aed"></i>ChatGPT</div><div class="tchip" ><i style="background:#4a76d6"></i>Gemini</div><div class="tchip" ><i style="background:#2e9b63"></i>Perplexity</div><div class="tchip" ><i style="background:#d9a21b"></i>NotebookLM</div></div></div></div><div class="o-row"><div class="o-num">2</div><div class="o-body"><div class="o-lab">CONSTRUYE</div><div class="o-chips"><div class="tchip" ><i style="background:#d74ac5"></i>Lovable</div><div class="tchip" ><i style="background:#170b2e"></i>v0</div></div></div></div><div class="o-row"><div class="o-num">3</div><div class="o-body"><div class="o-lab">AUTOMATIZA</div><div class="o-chips"><div class="tchip" ><i style="background:#7c3aed"></i>Make</div><div class="tchip" ><i style="background:#d64545"></i>n8n</div><div class="tchip" ><i style="background:#d97a4a"></i>Claude</div><div class="tchip" ><i style="background:#2e9b63"></i>Webhooks</div></div></div></div><div class="o-row"><div class="o-num">4</div><div class="o-body"><div class="o-lab">PRESENTA</div><div class="o-chips"><div class="tchip fin"><i style="background:#d74ac5"></i>Tu proyecto final</div></div></div></div></div></div>

        </div>

        <script>
          (function () {
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelectorAll(s); };
            var el = function (s) { return root.querySelector(s); };
            var tl = gsap.timeline({ paused: true });
            var rng = function (seed) {
              return function () {
                seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
                var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            };
            var splitLetters = function (host, cls) {
              var out = [];
              var walk = function (node) {
                Array.prototype.slice.call(node.childNodes).forEach(function (n) {
                  if (n.nodeType === 3) {
                    var frag = document.createDocumentFragment();
                    n.textContent.split(/(\s+)/).forEach(function (part) {
                      if (!part) return;
                      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(" ")); return; }
                      var w = document.createElement("span");
                      w.style.display = "inline-block";
                      w.style.whiteSpace = "nowrap";
                      Array.prototype.slice.call(part).forEach(function (ch) {
                        var s = document.createElement("span");
                        s.className = cls;
                        s.style.display = "inline-block";
                        s.textContent = ch;
                        w.appendChild(s);
                        out.push(s);
                      });
                      frag.appendChild(w);
                    });
                    n.parentNode.replaceChild(frag, n);
                  } else if (n.nodeType === 1) { walk(n); }
                });
              };
              walk(host);
              Array.prototype.slice.call(host.querySelectorAll(".grad")).forEach(function (g) {
                var ls = g.querySelectorAll("." + cls);
                var n = ls.length;
                Array.prototype.forEach.call(ls, function (s, i) {
                  var t = n > 1 ? i / (n - 1) : 0;
                  var c = "rgb(" + Math.round(84 + 97 * t) + "," + Math.round(33 + 3 * t) + "," + Math.round(166 - 7 * t) + ")";
                  s.style.color = c;
                  s.style.webkitTextFillColor = c;
                  s.style.background = "none";
                });
                g.style.background = "none";
              });
              return out;
            };


            tl.to(el(".o-bg"), { autoAlpha: 0, duration: 0.6 }, 0.9);
            var ls = splitLetters(el(".o-title"), "o-ch");
            ls.forEach(function (c, i) { tl.fromTo(c, { autoAlpha: 0, y: -90, rotation: (i % 2 ? 1 : -1) * 18 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.6, ease: "bounce.out" }, 0.15 + i * 0.045); });
            tl.set(el(".o-fill"), { scaleY: 0, transformOrigin: "50% 0%" }, 0);
            tl.to(el(".o-fill"), { scaleY: 1, duration: 3.4, ease: "power1.inOut" }, 1.0);
            var rows = q(".o-row");
            for (var k = 0; k < rows.length; k++) {
              var t0 = 0.9 + k * 0.9;
              tl.fromTo(rows[k].querySelector(".o-num"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, t0);
              tl.fromTo(rows[k].querySelector(".o-lab"), { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.45 }, t0 + 0.15);
              tl.fromTo(rows[k].querySelectorAll(".tchip"), { x: 900, autoAlpha: 0, rotation: function (i) { return (i % 2 ? 1 : -1) * 10; } }, { x: 0, autoAlpha: 1, rotation: 0, duration: 0.6, stagger: 0.12, ease: "back.out(1.4)" }, t0 + 0.35);
            }
            tl.fromTo(el(".fin"), { scale: 1 }, { scale: 1.08, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.8);
            tl.fromTo(el(".content"), { scale: 1 }, { scale: 1.025, duration: 6.6, ease: "none" }, 0);

            tl.seek(0);
            window.__timelines["scene-orden"] = tl;
          })();
        </script>
