<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 400 600; font-style: normal; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; font-style: normal; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500 600; font-style: normal; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; font-style: normal; }

      /* Warmi Academy palette (sampled from the site recording) */
      :root {
        --stage: #faf7ff;
        --ink: #170b2e;
        --muted: #4b4560;
        --violet: #5421a6;
        --violet-2: #7c3aed;
        --pink: #d74ac5;
        --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--stage); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--font-body); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-fps="30" data-width="1080" data-height="1920">
      <div id="stage-bg" data-composition-id="stage-bg" data-composition-src="compositions/stage-bg.html" data-start="0" data-duration="40" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="scene-caos" data-composition-id="scene-caos" data-composition-src="compositions/scene-caos.html" data-start="0" data-duration="5.7" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-orden" data-composition-id="scene-orden" data-composition-src="compositions/scene-orden.html" data-start="5.2" data-duration="6.6" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="scene-semanas" data-composition-id="scene-semanas" data-composition-src="compositions/scene-semanas.html" data-start="11.3" data-duration="7.0" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="scene-parati" data-composition-id="scene-parati" data-composition-src="compositions/scene-parati.html" data-start="17.8" data-duration="6.5" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="scene-jaime" data-composition-id="scene-jaime" data-composition-src="compositions/scene-jaime.html" data-start="23.8" data-duration="6.5" data-track-index="5" data-width="1080" data-height="1920"></div>
      <div id="scene-final" data-composition-id="scene-final" data-composition-src="compositions/scene-final.html" data-start="29.8" data-duration="10.2" data-track-index="6" data-width="1080" data-height="1920"></div>
      <audio id="voz-v1" src="audio/seg/v1.wav" data-start="0.4" data-duration="4.02" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-v2" src="audio/seg/v2.wav" data-start="5.8" data-duration="5.60" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-v3" src="audio/seg/v3.wav" data-start="11.9" data-duration="6.00" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-v4" src="audio/seg/v4.wav" data-start="18.4" data-duration="5.03" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-v5" src="audio/seg/v5.wav" data-start="24.4" data-duration="5.58" data-track-index="12" data-volume="1"></audio>
      <audio id="voz-v7" src="audio/seg/v7.wav" data-start="30.6" data-duration="6.99" data-track-index="12" data-volume="1"></audio>
      <audio id="musica-fondo" src="audio/musica-duck.wav" data-start="0" data-duration="40" data-track-index="13" data-volume="0.9"></audio>
      <audio id="efectos-sonido" src="audio/efectos.wav" data-start="0" data-duration="40" data-track-index="14" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#scene-orden", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(150% at 50% 50%)", duration: 0.7, ease: "power2.inOut" }, 5.2);
      const pushUp = (from, to, t, d) => {
        tl.to(from, { y: -1920, filter: "blur(10px)", duration: d, ease: "power3.inOut" }, t);
        tl.fromTo(to, { y: 1920, filter: "blur(10px)" }, { y: 0, filter: "blur(0px)", duration: d, ease: "power3.inOut" }, t);
      };
      const pushLeft = (from, to, t, d) => {
        tl.to(from, { x: -1080, filter: "blur(10px)", duration: d, ease: "power3.inOut" }, t);
        tl.fromTo(to, { x: 1080, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: d, ease: "power3.inOut" }, t);
      };
      pushUp("#scene-orden", "#scene-semanas", 11.3, 0.5);
      pushLeft("#scene-semanas", "#scene-parati", 17.8, 0.5);
      pushUp("#scene-parati", "#scene-jaime", 23.8, 0.5);
      tl.fromTo("#scene-final", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(150% at 50% 50%)", duration: 0.7, ease: "power2.inOut" }, 29.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
